[supervisord]
nodaemon=true
logfile=/app/data/supervisord.log
pidfile=/var/run/supervisord.pid

[program:recorder]
command=python main.py record
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/data/recorder.err.log
stdout_logfile=/app/data/recorder.out.log
environment=PYTHONUNBUFFERED=1

[program:dashboard]
command=streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
stderr_logfile=/app/data/dashboard.err.log
stdout_logfile=/app/data/dashboard.out.log
environment=PYTHONUNBUFFERED=1

